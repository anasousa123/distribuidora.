<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Admin - Distribuidora Prime</title>

<link rel="stylesheet" href="style.css">

<link rel="preconnect" href="https://fonts.googleapis.com">

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

</head>

<body>

<!-- HEADER -->

<header class="header">

<div class="logo">

🍺 PRIME ADMIN

</div>

<nav>

<a href="index.html">

Voltar ao Site

</a>

<a href="pedidos.html" class="admin-btn">

Pedidos

</a>

</nav>

</header>

<!-- TOPO -->

<section class="pagina-topo">

<h1>

⚙ Painel Administrativo

</h1>

<p>

Gerencie produtos, pedidos e promoções.

</p>

</section>

<!-- FORMULÁRIO -->

<section class="admin-area">

<div class="admin-box fade-up">

<h2>

➕ Adicionar Produto

</h2>

<input
type="text"
id="nome"
placeholder="Nome do produto">

<input
type="number"
id="preco"
placeholder="Preço">

<input
type="text"
id="imagem"
placeholder="URL da imagem">

<button
id="salvar"
class="finalizar">

Salvar Produto

</button>

</div>

</section>

<!-- LISTA -->

<section class="produtos">

<h2 class="admin-title">

📦 Produtos Cadastrados

</h2>

<div
id="admin-lista"
class="grid-produtos">

</div>

</section>

<!-- JS -->

<script type="module" src="admin.js"></script>

</body>
</html>
